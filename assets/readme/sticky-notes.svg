<svg xmlns="http://www.w3.org/2000/svg" width="920" height="520" viewBox="0 0 920 520" role="img" aria-label="Sticky notes from the NehangOS desktop">
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="10" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <style>
      .note { font-family: "Segoe Print", "Bradley Hand", "Comic Sans MS", "Chalkboard SE", cursive; }
      .line { font-size: 22px; font-weight: 600; }
      .line-sm { font-size: 20px; font-weight: 600; }
      .code { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 15px; font-weight: 600; }
    </style>
  </defs>

  <!-- yellow -->
  <g transform="translate(40 48) rotate(-3.6 105 70)" filter="url(#soft)">
    <rect width="210" height="150" rx="3" fill="#ffe36e"/>
    <rect width="210" height="10" fill="#f0d45a" opacity="0.55"/>
    <circle cx="92" cy="0" r="8" fill="#c0392b"/>
    <circle cx="92" cy="0" r="3.2" fill="#7a1f18" opacity="0.35"/>
    <text class="note line" x="22" y="52" fill="#3a2208">this is a Mac now.</text>
    <text class="note line-sm" x="22" y="84" fill="#3a2208">please do not ask</text>
    <text class="note line-sm" x="22" y="112" fill="#3a2208">where the files went.</text>
  </g>

  <!-- pink -->
  <g transform="translate(340 36) rotate(4.8 110 75)" filter="url(#soft)">
    <rect width="230" height="160" rx="3" fill="#ffb7d5"/>
    <rect width="230" height="10" fill="#f49cbc" opacity="0.55"/>
    <circle cx="142" cy="0" r="8" fill="#1abc9c"/>
    <circle cx="142" cy="0" r="3.2" fill="#0e7a66" opacity="0.35"/>
    <text class="note line-sm" x="24" y="52" fill="#4a1230">I built an entire OS</text>
    <text class="note line-sm" x="24" y="82" fill="#4a1230">so I wouldn't have to</text>
    <text class="note line-sm" x="24" y="112" fill="#4a1230">write a cover letter.</text>
  </g>

  <!-- mint -->
  <g transform="translate(660 52) rotate(2.2 100 70)" filter="url(#soft)">
    <rect width="210" height="150" rx="3" fill="#c6f5d4"/>
    <rect width="210" height="10" fill="#9fe3b4" opacity="0.55"/>
    <circle cx="80" cy="0" r="8" fill="#8e44ad"/>
    <circle cx="80" cy="0" r="3.2" fill="#5b2a73" opacity="0.35"/>
    <text class="code" x="18" y="58" fill="#14331f">git commit -m "fix"</text>
    <text class="note line-sm" x="22" y="98" fill="#14331f">it was not a fix.</text>
  </g>

  <!-- lilac -->
  <g transform="translate(70 280) rotate(-2.8 110 70)" filter="url(#soft)">
    <rect width="220" height="150" rx="3" fill="#e0d4ff"/>
    <rect width="220" height="10" fill="#c9b6f5" opacity="0.55"/>
    <circle cx="105" cy="0" r="8" fill="#3498db"/>
    <circle cx="105" cy="0" r="3.2" fill="#1f6f9f" opacity="0.35"/>
    <text class="note line-sm" x="24" y="52" fill="#2e1a52">my sleep schedule</text>
    <text class="note line-sm" x="24" y="82" fill="#2e1a52">has more branches</text>
    <text class="note line-sm" x="24" y="112" fill="#2e1a52">than this repo.</text>
  </g>

  <!-- peach -->
  <g transform="translate(350 290) rotate(3.4 105 70)" filter="url(#soft)">
    <rect width="220" height="155" rx="3" fill="#ffd6b8"/>
    <rect width="220" height="10" fill="#f0b88a" opacity="0.55"/>
    <circle cx="128" cy="0" r="8" fill="#e84393"/>
    <circle cx="128" cy="0" r="3.2" fill="#a01f5f" opacity="0.35"/>
    <text class="note line-sm" x="24" y="52" fill="#4a2410">spent 4 hours</text>
    <text class="note line-sm" x="24" y="82" fill="#4a2410">on the dock bounce.</text>
    <text class="note line-sm" x="24" y="118" fill="#4a2410">called it architecture.</text>
  </g>

  <!-- sky -->
  <g transform="translate(640 275) rotate(-4.2 110 75)" filter="url(#soft)">
    <rect width="220" height="160" rx="3" fill="#c5e8ff"/>
    <rect width="220" height="10" fill="#9fd0f2" opacity="0.55"/>
    <circle cx="123" cy="0" r="8" fill="#e67e22"/>
    <circle cx="123" cy="0" r="3.2" fill="#a35412" opacity="0.35"/>
    <text class="note line" x="24" y="52" fill="#12324a">recruiters:</text>
    <text class="note line-sm" x="24" y="86" fill="#12324a">the Mail app actually</text>
    <text class="note line-sm" x="24" y="116" fill="#12324a">works. try it.</text>
  </g>
</svg>
