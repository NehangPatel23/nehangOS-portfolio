<svg xmlns="http://www.w3.org/2000/svg" width="560" height="168" viewBox="0 0 560 168" role="img" aria-label="Contact links - Live site, email, GitHub, LinkedIn, Resume">
  <defs>
    <filter id="cardShadow" x="-8%" y="-12%" width="116%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <linearGradient id="safariBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#64d2ff"/>
      <stop offset="100%" stop-color="#0a84ff"/>
    </linearGradient>
    <linearGradient id="mailBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5ac8fa"/>
      <stop offset="100%" stop-color="#007aff"/>
    </linearGradient>
    <linearGradient id="pdfGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e8e8ed"/>
    </linearGradient>
    <linearGradient id="ghGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#48484a"/>
      <stop offset="100%" stop-color="#1c1c1e"/>
    </linearGradient>
  </defs>

  <rect x="12" y="10" width="536" height="148" rx="18" fill="#2c2c2e" stroke="#48484a" filter="url(#cardShadow)"/>

  <!-- Live site -->
  <g transform="translate(44 34)">
    <rect width="56" height="56" rx="14" fill="url(#safariBlue)"/>
    <circle cx="28" cy="28" r="16" fill="#f5f5f7"/>
    <circle cx="28" cy="28" r="12.5" fill="url(#safariBlue)"/>
    <path d="M28 16.5 L31.2 26.2 L41 28 L31.2 29.8 L28 39.5 L24.8 29.8 L15 28 L24.8 26.2 Z" fill="#ff3b30"/>
    <path d="M28 16.5 L28 39.5 L24.8 29.8 L15 28 L24.8 26.2 Z" fill="#f5f5f7"/>
    <text x="28" y="78" text-anchor="middle" fill="#f5f5f7" font-family="system-ui,-apple-system,sans-serif" font-size="11" font-weight="600">Live site</text>
  </g>

  <!-- Email -->
  <g transform="translate(148 34)">
    <rect width="56" height="56" rx="14" fill="url(#mailBlue)"/>
    <rect x="11" y="18" width="34" height="22" rx="4" fill="#f5f5f7"/>
    <path d="M13 20 L28 31 L43 20" fill="none" stroke="#0a84ff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="28" y="78" text-anchor="middle" fill="#f5f5f7" font-family="system-ui,-apple-system,sans-serif" font-size="11" font-weight="600">Email</text>
  </g>

  <!-- GitHub -->
  <g transform="translate(252 34)">
    <rect width="56" height="56" rx="14" fill="url(#ghGrad)" stroke="#636366"/>
    <path fill="#f5f5f7" d="M28 14.5c-7.5 0-13.5 6.1-13.5 13.5 0 6 3.9 11 9.3 12.8.7.1.9-.3.9-.6v-2.2c-3.8.8-4.6-1.8-4.6-1.8-.6-1.5-1.5-1.9-1.5-1.9-1.2-.8.1-.8.1-.8 1.3.1 2 .1 2.7 1.5 1.2 2 3.1 1.4 3.8 1.1.1-.9.5-1.4.8-1.8-2.9-.3-6-1.5-6-6.5 0-1.4.5-2.6 1.4-3.5-.1-.3-.6-1.7.1-3.5 0 0 1.1-.4 3.6 1.3a12.4 12.4 0 0 1 6.6 0c2.5-1.7 3.6-1.3 3.6-1.3.7 1.8.3 3.2.1 3.5.9.9 1.4 2.1 1.4 3.5 0 5-3.1 6.2-6.1 6.5.5.4.9 1.2.9 2.5v3.7c0 .3.2.7.9.6A13.5 13.5 0 0 0 41.5 28c0-7.4-6-13.5-13.5-13.5z"/>
    <text x="28" y="78" text-anchor="middle" fill="#f5f5f7" font-family="system-ui,-apple-system,sans-serif" font-size="11" font-weight="600">GitHub</text>
  </g>

  <!-- LinkedIn -->
  <g transform="translate(356 34)">
    <rect width="56" height="56" rx="14" fill="#0a66c2"/>
    <text x="28" y="38" text-anchor="middle" fill="#fff" font-family="system-ui,-apple-system,sans-serif" font-size="22" font-weight="800">in</text>
    <text x="28" y="78" text-anchor="middle" fill="#f5f5f7" font-family="system-ui,-apple-system,sans-serif" font-size="11" font-weight="600">LinkedIn</text>
  </g>

  <!-- Resume PDF -->
  <g transform="translate(460 34)">
    <rect width="56" height="56" rx="14" fill="#3a3a3c"/>
    <path fill="url(#pdfGrad)" d="M18 12h14l10 10v24c0 2-1.5 3.5-3.5 3.5h-20.5c-2 0-3.5-1.5-3.5-3.5v-30.5c0-2 1.5-3.5 3.5-3.5z"/>
    <path fill="#d1d1d6" d="M32 12v8c0 1.6 1.1 3.5 3.5 3.5H44"/>
    <rect x="16" y="34" width="24" height="10" rx="2.5" fill="#ff3b30"/>
    <text x="28" y="42" text-anchor="middle" fill="#fff" font-family="system-ui,-apple-system,sans-serif" font-size="7" font-weight="800">PDF</text>
    <text x="28" y="78" text-anchor="middle" fill="#f5f5f7" font-family="system-ui,-apple-system,sans-serif" font-size="11" font-weight="600">Resume</text>
  </g>
</svg>
