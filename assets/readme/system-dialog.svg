<svg xmlns="http://www.w3.org/2000/svg" width="420" height="220" viewBox="0 0 420 220" role="img" aria-label="NehangOS system dialog">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect x="20" y="16" width="380" height="188" rx="14" fill="#2c2c2e" stroke="#48484a" filter="url(#shadow)"/>
  <circle cx="70" cy="70" r="22" fill="#0a84ff"/>
  <text x="70" y="78" text-anchor="middle" fill="#fff" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700">!</text>
  <text x="108" y="58" fill="#f5f5f7" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700">NehangOS has encountered</text>
  <text x="108" y="80" fill="#f5f5f7" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700">an unexpected recruiter.</text>
  <text x="108" y="108" fill="#aeaeb2" font-family="system-ui, -apple-system, sans-serif" font-size="12">Do you want to move Resume.pdf to Desktop</text>
  <text x="108" y="126" fill="#aeaeb2" font-family="system-ui, -apple-system, sans-serif" font-size="12">or open Mail like a functional adult?</text>
  <rect x="120" y="150" width="110" height="32" rx="8" fill="#3a3a3c"/>
  <text x="175" y="171" text-anchor="middle" fill="#f5f5f7" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">Cancel</text>
  <rect x="244" y="150" width="130" height="32" rx="8" fill="#0a84ff"/>
  <text x="309" y="171" text-anchor="middle" fill="#fff" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">Open Mail</text>
</svg>
